name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-python:
    name: Test Python Package
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        
    - name: Run linting
      run: |
        ruff check sentinelci/
        black --check sentinelci/
        
    - name: Run type checking
      run: |
        mypy sentinelci/
        
    - name: Test CLI commands
      run: |
        sci --help
        sci version
        
    - name: Test package import
      run: |
        python -c "import sentinelci; print('Package imported successfully')"
        
  test-npm:
    name: Test NPM Package
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ['16', '18', '20']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        
    - name: Set up Python (for NPM wrapper)
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install Python package locally
      run: |
        pip install -e .
        
    - name: Install NPM dependencies
      run: npm install
      
    - name: Test NPM wrapper
      run: |
        node test.js
        
    - name: Test CLI executables
      run: |
        node bin/sci --help || echo "CLI test completed"
        
  build-test:
    name: Build and Test Packages
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine
        
    - name: Build Python package
      run: |
        python -m build
        
    - name: Check Python package
      run: |
        twine check dist/*
        
    - name: Test Python package installation
      run: |
        pip install dist/*.whl
        sci --help
        sci version
        
    - name: Install NPM dependencies
      run: npm install
      
    - name: Test NPM package
      run: |
        npm pack --dry-run
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: packages
        path: |
          dist/
          *.tgz
          
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install package
      run: |
        pip install -e .
        
    - name: Run security scan on itself
      run: |
        sci scan --format json --output security-results.json || true
        
    - name: Upload security results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-results
        path: security-results.json