name: Publish to PyPI and NPM

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  publish-pypi:
    name: Publish Python Package to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # For trusted publishing
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
        
    - name: Build package
      run: |
        python -m build
        
    - name: Check package
      run: |
        twine check dist/*
        
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        
  publish-npm:
    name: Publish NPM Package
    runs-on: ubuntu-latest
    needs: publish-pypi  # Wait for PyPI to be published first
    environment: release
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        registry-url: 'https://registry.npmjs.org'
        
    - name: Set up Python (for NPM wrapper testing)
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install NPM dependencies
      run: npm install
      
    - name: Wait for PyPI package availability
      run: |
        echo "Waiting for PyPI package to be available..."
        for i in {1..30}; do
          if pip install sentinelci --dry-run 2>/dev/null; then
            echo "PyPI package is available!"
            break
          fi
          echo "Attempt $i: PyPI package not yet available, waiting 30 seconds..."
          sleep 30
        done
        
    - name: Test NPM package
      run: |
        node test.js
        
    - name: Publish to NPM
      run: npm publish
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        
  create-github-release:
    name: Update GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-pypi, publish-npm]
    if: github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.event.inputs.version }}
        release_name: Release v${{ github.event.inputs.version }}
        body: |
          ## 🚀 SentinelCI v${{ github.event.inputs.version }}
          
          ### Installation
          
          **Python Package:**
          ```bash
          pip install sentinelci
          ```
          
          **NPM Package:**
          ```bash
          npm install -g sentinelci
          ```
          
          ### Quick Start
          ```bash
          sci onboard  # Interactive setup
          sci scan     # Scan current directory
          ```
          
          ### Links
          - 🐍 [PyPI Package](https://pypi.org/project/sentinelci/)
          - 📦 [NPM Package](https://www.npmjs.com/package/sentinelci)
          - 📚 [Documentation](https://github.com/sentinelci/sentinelci#readme)
          
        draft: false
        prerelease: false