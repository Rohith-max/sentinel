name: Update Dependencies

on:
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday
  workflow_dispatch:

jobs:
  update-python-deps:
    name: Update Python Dependencies
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install pip-tools
      run: |
        python -m pip install --upgrade pip
        pip install pip-tools
        
    - name: Update dependencies
      run: |
        # Create requirements.in from pyproject.toml dependencies
        python -c "
        import tomli
        with open('pyproject.toml', 'rb') as f:
            data = tomli.load(f)
        deps = data['project']['dependencies']
        with open('requirements.in', 'w') as f:
            for dep in deps:
                f.write(dep + '\n')
        "
        
        # Compile updated requirements
        pip-compile requirements.in
        
    - name: Check for changes
      id: changes
      run: |
        if git diff --quiet; then
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          echo "changed=true" >> $GITHUB_OUTPUT
        fi
        
    - name: Create Pull Request
      if: steps.changes.outputs.changed == 'true'
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'chore: update Python dependencies'
        title: 'chore: update Python dependencies'
        body: |
          ## 🔄 Automated Dependency Update
          
          This PR updates Python dependencies to their latest compatible versions.
          
          ### Changes
          - Updated `requirements.txt` with latest compatible versions
          - All dependencies remain within specified version constraints
          
          ### Testing
          - [ ] CI tests pass
          - [ ] Manual testing completed
          
          **Auto-generated by GitHub Actions**
        branch: update-python-deps
        delete-branch: true
        
  update-npm-deps:
    name: Update NPM Dependencies
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Update NPM dependencies
      run: |
        npm update
        npm audit fix --force || true
        
    - name: Check for changes
      id: changes
      run: |
        if git diff --quiet package*.json; then
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          echo "changed=true" >> $GITHUB_OUTPUT
        fi
        
    - name: Create Pull Request
      if: steps.changes.outputs.changed == 'true'
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'chore: update NPM dependencies'
        title: 'chore: update NPM dependencies'
        body: |
          ## 🔄 Automated NPM Dependency Update
          
          This PR updates NPM dependencies to their latest compatible versions.
          
          ### Changes
          - Updated `package.json` and `package-lock.json`
          - Applied security fixes where available
          
          ### Testing
          - [ ] CI tests pass
          - [ ] NPM wrapper functionality verified
          
          **Auto-generated by GitHub Actions**
        branch: update-npm-deps
        delete-branch: true